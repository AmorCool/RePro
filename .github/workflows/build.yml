name: Build RePro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg 2>/dev/null || true
          echo "ldid: $(command -v ldid || echo MISSING)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo MISSING)"

      # daemon 需要链接 iOS arm64 版 OpenSSL，brew 的是 macOS 版无法链接，必须交叉编译
      - name: Cache OpenSSL (iOS arm64)
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-ios
          key: openssl-ios-arm64-3.4.1-${{ runner.os }}

      - name: Build OpenSSL for iOS arm64
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          OPENSSL_VER=3.4.1
          rm -rf /tmp/openssl-ios-src
          git clone --depth 1 --branch "openssl-${OPENSSL_VER}" https://github.com/openssl/openssl.git /tmp/openssl-ios-src
          cd /tmp/openssl-ios-src
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $(xcrun --sdk iphoneos --show-sdk-path))
          ./Configure ios64-xcrun no-shared no-tests no-asm --prefix=/tmp/openssl-ios > /dev/null
          make -j$(sysctl -n hw.ncpu) > /dev/null 2>&1
          make install_sw > /dev/null 2>&1
          ls -la /tmp/openssl-ios/lib/

      - name: Build iOS App (RePro)
        run: |
          set -e

          # 本项目无第三方依赖，直接用 xcodeproj 构建（无 CocoaPods / SwiftPM）
          xcodebuild -project RePro.xcodeproj \
            -scheme RePro \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            2>&1 | tee build.log | tail -50

          # 检查构建产物
          APP_PATH=$(find build -name "RePro.app" -type d | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "error: RePro.app not found"
            echo "=== 所有编译错误行 ==="
            grep -nE "error:|fatal error:|Undefined symbol|does not contain a scheme" build.log || true
            echo "=== 构建日志最后 120 行 ==="
            tail -120 build.log
            exit 1
          fi
          echo "Built app at $APP_PATH"

      - name: Build Daemon (reprovisiond)
        run: |
          set -e

          mkdir -p build/obj
          : > daemon_build.log

          # 交叉编译得到的 iOS arm64 OpenSSL
          OPENSSL_DIR=/tmp/openssl-ios

          # 注意：不能把 -I Daemon/libplist 加进公共头文件路径。
          # libplist 自带与系统头同名的 String.h/Array.h 等，加进 -I 后
          # #include <string.h> 会被大小写不敏感地解析成 libplist 的 String.h（C++ 头），
          # 进而拉入 Node.h 的 <cstddef> 导致 C 编译失败。
          # libplist/ldid 内部均用相对路径引用彼此的头文件（如 "../libplist/plist.h"），
          # 因此无需 -I Daemon/libplist。
          # -DHAVE_CONFIG_H 让 libplist 的 plist.h 真正包含我们手写的精简 config.h
          # （autotools 由 ./configure 在命令行注入该宏，手动构建需自行补上）。
          COMMON_FLAGS="-arch arm64 -miphoneos-version-min=15.0 -DHAVE_CONFIG_H \
            -I Daemon -I Daemon/ldid -I Daemon/include \
            -I ${OPENSSL_DIR}/include"

          # C 源码必须用 C 模式编译（clang++ 会把 .c 当 C++，导致 libplist/lookup2 报类型错误）
          C_SOURCES=$(find Daemon/libplist -name '*.c' ! -path '*test*' ! -path '*tools*')
          C_SOURCES="$C_SOURCES Daemon/ldid/lookup2.c"
          # C++ 源码
          CXX_SOURCES=$(find Daemon/libplist -name '*.cpp' ! -path '*test*' ! -path '*tools*')
          CXX_SOURCES="$CXX_SOURCES Daemon/ldid/ldid.cpp"
          # ObjC 源码（排除 ccsrp.m：corecrypto 透明联合体与现代 clang 不兼容，
          # Daemon 的其他 .m 均通过 dlopen/dlsym 动态调用 libcorecrypto）
          OBJC_SOURCES=$(ls Daemon/*.m | grep -v ccsrp.m)
          # ObjC++ 源码
          OBJCXX_SOURCES=$(ls Daemon/*.mm 2>/dev/null || true)

          echo "=== 编译 C 源码（C 模式）==="
          for f in $C_SOURCES; do
            o="build/obj/$(echo "$f" | tr '/' '_').o"
            xcrun -sdk iphoneos clang -x c -std=gnu11 $COMMON_FLAGS -c "$f" -o "$o" >> daemon_build.log 2>&1 || \
              { echo "FAILED: $f"; tail -200 daemon_build.log; exit 1; }
          done

          echo "=== 编译 C++ 源码 ==="
          for f in $CXX_SOURCES; do
            o="build/obj/$(echo "$f" | tr '/' '_').o"
            xcrun -sdk iphoneos clang++ -x c++ -std=gnu++17 $COMMON_FLAGS -c "$f" -o "$o" >> daemon_build.log 2>&1 || \
              { echo "FAILED: $f"; tail -200 daemon_build.log; exit 1; }
          done

          echo "=== 编译 ObjC 源码 ==="
          for f in $OBJC_SOURCES; do
            o="build/obj/$(echo "$f" | tr '/' '_').o"
            xcrun -sdk iphoneos clang -x objective-c -fobjc-arc $COMMON_FLAGS -c "$f" -o "$o" >> daemon_build.log 2>&1 || \
              { echo "FAILED: $f"; tail -200 daemon_build.log; exit 1; }
          done

          echo "=== 编译 ObjC++ 源码 ==="
          for f in $OBJCXX_SOURCES; do
            o="build/obj/$(echo "$f" | tr '/' '_').o"
            xcrun -sdk iphoneos clang++ -x objective-c++ -std=gnu++17 -fobjc-arc $COMMON_FLAGS -c "$f" -o "$o" >> daemon_build.log 2>&1 || \
              { echo "FAILED: $f"; tail -200 daemon_build.log; exit 1; }
          done

          echo "=== 链接 reprovisiond ==="
          xcrun -sdk iphoneos clang++ \
            -arch arm64 -miphoneos-version-min=15.0 \
            -framework Foundation -framework Security -framework CoreFoundation \
            -L "${OPENSSL_DIR}/lib" -lssl -lcrypto -lz \
            -Wl,-undefined,dynamic_lookup \
            -o build/reprovisiond \
            build/obj/*.o >> daemon_build.log 2>&1 || true

          if [ ! -f build/reprovisiond ]; then
            echo "error: reprovisiond build failed"
            echo "=== 所有编译错误行 ==="
            grep -nE "error:|fatal error:|Undefined symbol" daemon_build.log || true
            echo "=== Daemon 构建日志（尾部 150 行）==="
            tail -150 daemon_build.log
            exit 1
          fi

          file build/reprovisiond
          chmod +x build/reprovisiond
          echo "Daemon built successfully"

      - name: Cross-compile zsign for iOS (arm64)
        # zsign 是设备端签名后端（纯 C/C++，仅依赖 OpenSSL）。
        # zlib/minizip 已内嵌在其源码树中。交叉编译为 iOS arm64 静态链接版，
        # 输出 /tmp/zsign，后续打包阶段复制到三套 deb 的正确路径。
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"

          OPENSSL_DIR=/tmp/openssl-ios

          # zsign 源码（pinned commit 保证可重现构建）
          ZSIGN_COMMIT=d6e929c97b5b564c2cc1f82afe226a44da7149a0
          ZS_OBJ=/tmp/zsign-obj
          rm -rf /tmp/zsign-src "$ZS_OBJ"
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign-src
          cd /tmp/zsign-src
          git fetch --depth 1 origin "${ZSIGN_COMMIT}"
          git checkout "${ZSIGN_COMMIT}"
          mkdir -p "$ZS_OBJ"

          CFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3"
          CXXFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3 -std=c++11"

          # zlib（C 模式——minizip 的 zip.c 传 void* 给 crc32()，C++ 下隐式转换非法）
          for f in src/third-party/zlib/*.c; do
            clang $CFLAGS -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # minizip（C 模式）
          for f in src/third-party/minizip/ioapi.c src/third-party/minizip/zip.c src/third-party/minizip/unzip.c; do
            clang $CFLAGS -I src -I src/common -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # zsign 核心 + common（C++）
          for f in src/*.cpp src/common/*.cpp; do
            clang++ $CXXFLAGS -I src -I src/common -I src/third-party/zlib \
              -I ${OPENSSL_DIR}/include -DZSIGN_VERSION="${ZSIGN_COMMIT:0:8}" \
              -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # 链接（静态链接 OpenSSL）
          clang++ $CXXFLAGS "$ZS_OBJ"/*.o \
            -L ${OPENSSL_DIR}/lib -lssl -lcrypto \
            -o /tmp/zsign
          cd -

          echo "=== zsign binary (expect Mach-O arm64 for iOS) ==="
          file /tmp/zsign
          lipo -info /tmp/zsign
          ls -lh /tmp/zsign
          echo "zsign built successfully"

      - name: Sign with entitlements + 打包资源
        run: |
          set -e
          LDID=$(command -v ldid)

          # --- Rootless deb (Dopamine) ---
          PKG="Packages/rootless"
          RL="$PKG/var/jb"
          mkdir -p "$RL/Applications" "$RL/usr/libexec" "$RL/usr/local/bin" \
                   "$RL/Library/LaunchDaemons" "$RL/usr/share/reprovision/certificates"
          APP_DIR=$(find build -name "RePro.app" -type d | head -1)
          cp -R "$APP_DIR" "$RL/Applications/"
          cp build/reprovisiond "$RL/usr/libexec/"
          cp /tmp/zsign "$RL/usr/local/bin/zsign"
          chmod 0755 "$RL/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$RL/usr/share/reprovision/certificates/"

          # 验证 Assets.car 存在（图标依赖于此文件）
          echo "=== 验证 .app 包结构 ==="
          ls -lah "$RL/Applications/RePro.app/"
          if [ -f "$RL/Applications/RePro.app/Assets.car" ]; then
              echo "Assets.car 存在: $(ls -lh "$RL/Applications/RePro.app/Assets.car" | awk '{print $5}')"
          else
              echo "警告: Assets.car 不存在！图标可能无法显示"
          fi

          # 复制图标（供 Sileo/Cydia 显示，不影响 iOS 图标加载）
          cp Resources/Icon.png "$RL/Applications/RePro.app/Icon.png"

          # 签名：先签二进制，不破坏 Assets.car
          "$LDID" -SResources/entitlements-base.plist "$RL/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$RL/usr/libexec/reprovisiond"
          "$LDID" -S "$RL/usr/local/bin/zsign"

          # --- Rootful deb ---
          PKG2="Packages/rootful"
          mkdir -p "$PKG2/Applications" "$PKG2/usr/libexec" "$PKG2/usr/local/bin" \
                   "$PKG2/Library/LaunchDaemons" "$PKG2/usr/share/reprovision/certificates"
          cp -R "$APP_DIR" "$PKG2/Applications/"
          cp build/reprovisiond "$PKG2/usr/libexec/"
          cp /tmp/zsign "$PKG2/usr/local/bin/zsign"
          chmod 0755 "$PKG2/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$PKG2/usr/share/reprovision/certificates/"
          cp Resources/Icon.png "$PKG2/Applications/RePro.app/Icon.png"
          "$LDID" -SResources/entitlements-base.plist "$PKG2/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$PKG2/usr/libexec/reprovisiond"
          "$LDID" -S "$PKG2/usr/local/bin/zsign"

          # --- RootHide deb ---
          PKG3="Packages/roothide"
          mkdir -p "$PKG3/Applications" "$PKG3/usr/libexec" "$PKG3/usr/local/bin" \
                   "$PKG3/Library/LaunchDaemons" "$PKG3/usr/share/reprovision/certificates"
          cp -R "$APP_DIR" "$PKG3/Applications/"
          cp build/reprovisiond "$PKG3/usr/libexec/"
          cp /tmp/zsign "$PKG3/usr/local/bin/zsign"
          chmod 0755 "$PKG3/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$PKG3/usr/share/reprovision/certificates/"
          cp Resources/Icon.png "$PKG3/Applications/RePro.app/Icon.png"
          "$LDID" -SResources/entitlements-roothide.plist "$PKG3/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$PKG3/usr/libexec/reprovisiond"
          "$LDID" -S "$PKG3/usr/local/bin/zsign"

          echo "Signing + packaging complete for all 3 packages (with zsign)"

      - name: Package debs
        run: |
          set -e
          # 版本号以 DEBIAN/control 中的 Version 为准（PackageVersion.plist 的 string 字段含空值，grep 易误取）
          VERSION=$(grep -m1 '^Version:' Packages/rootless/DEBIAN/control | awk '{print $2}')
          echo "Version: $VERSION"
          mkdir -p CydiaPackages

          # DEBIAN 维护脚本必须有可执行权限（0555~0775），否则 dpkg-deb 报错
          for pkg in rootless rootful roothide; do
            find "Packages/$pkg/DEBIAN" -type f -exec chmod 0755 {} \;
          done

          dpkg-deb -Zgzip -b Packages/rootless "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -Zgzip -b Packages/rootful "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm.deb"
          dpkg-deb -Zgzip -b Packages/roothide "CydiaPackages/jp.soh.reprovision_${VERSION}_roothide-iphoneos-arm64.deb"

          ls -lh CydiaPackages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag: ${{ github.ref_name }}
          name: "RePro ${{ github.ref_name }}"
          body: |
            ## RePro ${{ github.ref_name }}
            ### 安装包
            | 包 | 适用环境 |
            |---|---|
            | `*_roothide-iphoneos-arm64.deb` | **RootHide 用户安装此包** |
            | `*_iphoneos-arm64.deb` | Dopamine / rootless |
            | `*_iphoneos-arm.deb` | rootful (iOS 13/14) |
          files: CydiaPackages/*.deb
          draft: false
          prerelease: false
