name: Build RePro

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid openssl@3 zlib 2>/dev/null || true
          gem install cocoapods --no-document 2>/dev/null || true

      - name: CocoaPods install
        run: |
          set -e
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Build iOS App (RePro)
        run: |
          set -e

          # 使用 workspace（如果存在）或 project
          if [ -f RePro.xcworkspace/xcshareddata/swiftpm/Package.resolved ]; then
            BUILD_CMD="xcodebuild -workspace RePro.xcworkspace"
          else
            BUILD_CMD="xcodebuild -project RePro.xcodeproj"
          fi

          $BUILD_CMD \
            -scheme RePro \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            2>&1 | tee build.log | tail -50

          # 检查构建产物
          APP_PATH=$(find build -name "RePro.app" -type d | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "error: RePro.app not found"
            echo "=== 构建日志最后 100 行 ==="
            tail -100 build.log
            exit 1
          fi
          echo "Built app at $APP_PATH"

      - name: Build Daemon (reprovisiond)
        run: |
          set -e

          # 收集 libplist 所有需编译的源文件（.c 和 .cpp）
          LIBPLIST_C=$(find Daemon/libplist -name '*.c' ! -path '*test*' ! -path '*tools*' | tr '\n' ' ')
          LIBPLIST_CPP=$(find Daemon/libplist -name '*.cpp' ! -path '*test*' ! -path '*tools*' | tr '\n' ' ')

          # OpenSSL 头文件路径（brew 安装的 openssl@3）
          OPENSSL_DIR=$(brew --prefix openssl@3 2>/dev/null || echo "/usr/local/opt/openssl@3")

          echo "=== 编译 reprovisiond daemon ==="
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -std=c++17 \
            -framework Foundation \
            -framework Security \
            -framework CoreFoundation \
            -I Daemon \
            -I Daemon/ldid \
            -I Daemon/libplist \
            -I "${OPENSSL_DIR}/include" \
            -L "${OPENSSL_DIR}/lib" \
            -lssl -lcrypto -lz \
            -o build/reprovisiond \
            Daemon/main.m \
            Daemon/RZDaemon.m \
            Daemon/SignEngine.m \
            Daemon/ZSignBackend.m \
            Daemon/LdidBackend.m \
            Daemon/AnisetteManager.m \
            Daemon/TokenCacheManager.m \
            Daemon/HealthCheck.m \
            Daemon/ProfileInstaller.m \
            Daemon/EntitlementsGen.m \
            Daemon/EEAppleServices.m \
            Daemon/EEProvisioning.m \
            Daemon/EESigning.m \
            Daemon/ldid/ldid.cpp \
            Daemon/ldid/lookup2.c \
            ${LIBPLIST_C} \
            ${LIBPLIST_CPP} \
            2>&1 | tee daemon_build.log | tail -50

          if [ ! -f build/reprovisiond ]; then
            echo "error: reprovisiond build failed"
            echo "=== Daemon 构建日志 ==="
            cat daemon_build.log
            exit 1
          fi

          file build/reprovisiond
          chmod +x build/reprovisiond
          echo "Daemon built successfully"

      - name: Sign with entitlements + 打包资源
        run: |
          set -e
          LDID=$(command -v ldid)

          # --- Rootless deb (Dopamine) ---
          PKG="Packages/rootless"
          RL="$PKG/var/jb"
          mkdir -p "$RL/Applications" "$RL/usr/libexec" "$RL/usr/local/bin" \
                   "$RL/Library/LaunchDaemons" "$RL/usr/share/reprovision/certificates"
          cp -R $(find build -name "RePro.app" -type d | head -1) "$RL/Applications/"
          cp build/reprovisiond "$RL/usr/libexec/"
          cp Resources/Certificates/*.pem "$RL/usr/share/reprovision/certificates/"
          "$LDID" -SResources/entitlements-base.plist "$RL/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$RL/usr/libexec/reprovisiond"

          # --- Rootful deb ---
          PKG2="Packages/rootful"
          mkdir -p "$PKG2/Applications" "$PKG2/usr/libexec" "$PKG2/Library/LaunchDaemons" \
                   "$PKG2/usr/share/reprovision/certificates"
          cp -R $(find build -name "RePro.app" -type d | head -1) "$PKG2/Applications/"
          cp build/reprovisiond "$PKG2/usr/libexec/"
          cp Resources/Certificates/*.pem "$PKG2/usr/share/reprovision/certificates/"
          "$LDID" -SResources/entitlements-base.plist "$PKG2/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$PKG2/usr/libexec/reprovisiond"

          # --- RootHide deb ---
          PKG3="Packages/roothide"
          mkdir -p "$PKG3/Applications" "$PKG3/usr/libexec" "$PKG3/Library/LaunchDaemons" \
                   "$PKG3/usr/share/reprovision/certificates"
          cp -R $(find build -name "RePro.app" -type d | head -1) "$PKG3/Applications/"
          cp build/reprovisiond "$PKG3/usr/libexec/"
          cp Resources/Certificates/*.pem "$PKG3/usr/share/reprovision/certificates/"
          "$LDID" -SResources/entitlements-roothide.plist "$PKG3/Applications/RePro.app/RePro"
          "$LDID" -SResources/entitlements-daemon.plist "$PKG3/usr/libexec/reprovisiond"

          echo "Signing + packaging complete for all 3 packages"

      - name: Package debs
        run: |
          set -e
          VERSION=$(cat Resources/PackageVersion.plist | grep -o '<string>[0-9.]*</string>' | head -1 | grep -o '[0-9.]*')
          echo "Version: $VERSION"
          mkdir -p CydiaPackages

          dpkg-deb -Zgzip -b Packages/rootless "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -Zgzip -b Packages/rootful "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm.deb"
          dpkg-deb -Zgzip -b Packages/roothide "CydiaPackages/jp.soh.reprovision_${VERSION}_roothide-iphoneos-arm64.deb"

          ls -lh CydiaPackages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag: ${{ github.ref_name }}
          name: "RePro ${{ github.ref_name }}"
          body: |
            ## RePro ${{ github.ref_name }}
            ### 安装包
            | 包 | 适用环境 |
            |---|---|
            | `*_roothide-iphoneos-arm64.deb` | **RootHide 用户安装此包** |
            | `*_iphoneos-arm64.deb` | Dopamine / rootless |
            | `*_iphoneos-arm.deb` | rootful (iOS 13/14) |
          files: CydiaPackages/*.deb
          draft: false
          prerelease: false
