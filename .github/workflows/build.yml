name: Build ReSign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          echo "Installing ldid and dpkg..."
          brew install ldid dpkg 2>/dev/null || { echo "brew install failed, trying again..."; brew install ldid dpkg; }
          echo "ldid: $(command -v ldid || echo MISSING)"
          echo "dpkg-deb: $(command -v dpkg-deb || echo MISSING)"
          if ! command -v dpkg-deb &>/dev/null; then
            echo "dpkg-deb not found, installing via brew..."
            brew install dpkg
          fi

      # App 用 OpenSSL 1.1.x（CSR/签名兼容性），zsign 用 3.x（需要 provider API）
      - name: Cache OpenSSL 1.1.x for App (iOS arm64)
        id: openssl11-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-ios
          key: openssl-ios-1.1.1w-${{ runner.os }}

      - name: Build OpenSSL 1.1.x for iOS arm64 (App)
        if: steps.openssl11-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # OpenSSL 1.1.1w — 最后一个 1.1.x LTS，CSR/签名需要此版本。
          # 3.x 静态链接 default provider 不自动激活导致 CSR 生成失败。
          rm -rf /tmp/openssl-ios-src
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git /tmp/openssl-ios-src
          cd /tmp/openssl-ios-src
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $(xcrun --sdk iphoneos --show-sdk-path))
          ./Configure ios64-xcrun no-shared no-tests no-asm --prefix=/tmp/openssl-ios > /dev/null
          make -j$(sysctl -n hw.ncpu) > /dev/null 2>&1
          make install_sw > /dev/null 2>&1
          ls -la /tmp/openssl-ios/lib/

      - name: Cache OpenSSL 3.x for zsign (iOS arm64)
        id: openssl3-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl3-ios
          key: openssl3-ios-3.4.1-${{ runner.os }}

      - name: Build OpenSSL 3.x for iOS arm64 (zsign)
        if: steps.openssl3-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # zsign 需要 OpenSSL 3.x 的 OSSL_PROVIDER_load 等 API。
          OPENSSL_VER=3.4.1
          rm -rf /tmp/openssl3-ios-src
          git clone --depth 1 --branch "openssl-${OPENSSL_VER}" https://github.com/openssl/openssl.git /tmp/openssl3-ios-src
          cd /tmp/openssl3-ios-src
          export CROSS_TOP=$(xcrun --sdk iphoneos --show-sdk-platform-path)/Developer
          export CROSS_SDK=$(basename $(xcrun --sdk iphoneos --show-sdk-path))
          ./Configure ios64-xcrun no-shared no-tests no-asm --prefix=/tmp/openssl3-ios > /dev/null
          make -j$(sysctl -n hw.ncpu) > /dev/null 2>&1
          make install_sw > /dev/null 2>&1
          ls -la /tmp/openssl3-ios/lib/

      - name: Build iOS App (ReSign)
        run: |
          set -uo pipefail

          # 本项目无第三方依赖，直接用 xcodeproj 构建（无 CocoaPods / SwiftPM）
          echo "=== 开始 xcodebuild ==="
          xcodebuild -project RePro.xcodeproj \
            -scheme ReSign \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            > build.log 2>&1 || {
              echo "=== xcodebuild 失败，完整日志（前 200 行 + 错误行）： ==="
              grep -nE "error:|fatal error:|Undefined symbol|does not contain a scheme|BUILD FAILED" build.log | head -50
              echo "=== 日志尾部 80 行 ==="
              tail -80 build.log
              exit 1
            }

          echo "=== xcodebuild 成功，最后 30 行： ==="
          tail -30 build.log

          # 检查构建产物
          APP_PATH=$(find build -name "ReSign.app" -type d | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "error: ReSign.app not found"
            echo "=== 构建日志最后 120 行 ==="
            tail -120 build.log
            exit 1
          fi
          echo "Built app at $APP_PATH"

      - name: Build root helper (repro-helper)
        # 本项目已经没有常驻守护进程。需要 root 的两件事（跨沙箱复制 IPA、
        # 把描述文件写进 /var/Managed Preferences/mobile）交给一个 setuid root
        # 的一次性小工具 repro-helper，由 App 用 posix_spawn 按需拉起。
        # 它只依赖 Foundation + CommonCrypto（在 libSystem 里），一条 clang 就够。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation \
            -o build/repro-helper \
            Helper/repro-helper.m 2>&1 | tee helper_build.log

          if [ ! -f build/repro-helper ]; then
            echo "error: repro-helper build failed"
            cat helper_build.log
            exit 1
          fi

          file build/repro-helper
          chmod +x build/repro-helper
          echo "root helper built successfully"

      - name: Build profile daemon (repro-profiledaemon) for RootHide
        # RootHide 下 App 进程在 jbroot namespace 内，其 MCProfileConnection XPC 与
        # 对 /var/Managed Preferences/mobile 的写入都被重定向到 overlay（假成功），
        # 导致 installd 校验时 0xe8008015。repro-profiledaemon 由 launchd 在系统级
        # 上下文启动（不在 App namespace 内），写真实路径并直连真实 profiled。
        # App 通过 notify(3) + 真实共享路径触发安装。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation \
            -lobjc \
            -o build/repro-profiledaemon \
            Helper/repro-profiledaemon.m 2>&1 | tee profiledaemon_build.log

          if [ ! -f build/repro-profiledaemon ]; then
            echo "error: repro-profiledaemon build failed"
            cat profiledaemon_build.log
            exit 1
          fi

          file build/repro-profiledaemon
          chmod +x build/repro-profiledaemon
          echo "profile daemon built successfully"

      - name: Build import daemon (repro-importdaemon) for RootHide
        # RootHide 下 App（及其 posix_spawn 出的 repro-helper）都在 jbroot overlay
        # namespace 内，iCloud 真实路径 /var/mobile/Library/Mobile Documents 被重定向
        # 到空 overlay，App 读不到 iCloud 的 .ipa。repro-importdaemon 由 launchd 在
        # 系统级 rootfs 命名空间拉起（与 repro-profiledaemon 同款），能读真实 iCloud
        # 文件并拷到真实共享路径 /var/mobile/Library/RePro/imports/，App 再读回。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation \
            -lobjc \
            -o build/repro-importdaemon \
            Helper/repro-importdaemon.m 2>&1 | tee importdaemon_build.log

          if [ ! -f build/repro-importdaemon ]; then
            echo "error: repro-importdaemon build failed"
            cat importdaemon_build.log
            exit 1
          fi

          file build/repro-importdaemon
          chmod +x build/repro-importdaemon
          echo "import daemon built successfully"

      - name: Build signing daemon (repro-signingd)
        # repro-signingd 是后台定时续签守护进程。由 launchd 在系统启动时
        # 拉起（RunAtLoad + KeepAlive），用 GCD dispatch timer 定时检查是否需要续签
        # （v1.1.130 起，原 NSTimer 在越狱 daemon 环境实测不触发），
        # 通过 notify_post + 共享文件通知 App 执行自动续签。
        run: |
          set -e
          mkdir -p build

          xcrun -sdk iphoneos clang \
            -x objective-c -fobjc-arc \
            -arch arm64 -miphoneos-version-min=15.0 \
            -O2 \
            -framework Foundation -framework CoreFoundation \
            -o build/repro-signingd \
            Helper/repro-signingd.m 2>&1 | tee signingd_build.log

          if [ ! -f build/repro-signingd ]; then
            echo "error: repro-signingd build failed"
            cat signingd_build.log
            exit 1
          fi

          file build/repro-signingd
          chmod +x build/repro-signingd
          echo "signing daemon built successfully"

      - name: Cross-compile zsign for iOS (arm64)
        # zsign 是设备端签名后端（纯 C/C++，仅依赖 OpenSSL）。
        # zlib/minizip 已内嵌在其源码树中。交叉编译为 iOS arm64 静态链接版，
        # 输出 /tmp/zsign，后续打包阶段复制到三套 deb 的正确路径。
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"

          OPENSSL_DIR=/tmp/openssl3-ios

          # zsign 源码（pinned commit 保证可重现构建）
          ZSIGN_COMMIT=d6e929c97b5b564c2cc1f82afe226a44da7149a0
          ZS_OBJ=/tmp/zsign-obj
          rm -rf /tmp/zsign-src "$ZS_OBJ"
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign-src
          cd /tmp/zsign-src
          git fetch --depth 1 origin "${ZSIGN_COMMIT}"
          git checkout "${ZSIGN_COMMIT}"
          mkdir -p "$ZS_OBJ"

          CFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3"
          CXXFLAGS="-isysroot $SDK -arch arm64 -mios-version-min=12.0 -O3 -std=c++11"

          # zlib（C 模式——minizip 的 zip.c 传 void* 给 crc32()，C++ 下隐式转换非法）
          for f in src/third-party/zlib/*.c; do
            clang $CFLAGS -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # minizip（C 模式）
          for f in src/third-party/minizip/ioapi.c src/third-party/minizip/zip.c src/third-party/minizip/unzip.c; do
            clang $CFLAGS -I src -I src/common -I src/third-party/zlib -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # zsign 核心 + common（C++）
          for f in src/*.cpp src/common/*.cpp; do
            clang++ $CXXFLAGS -I src -I src/common -I src/third-party/zlib \
              -I ${OPENSSL_DIR}/include -DZSIGN_VERSION="${ZSIGN_COMMIT:0:8}" \
              -c "$f" -o "$ZS_OBJ/$(echo "$f" | tr '/' '_').o"
          done

          # 链接（静态链接 OpenSSL）
          clang++ $CXXFLAGS "$ZS_OBJ"/*.o \
            -L ${OPENSSL_DIR}/lib -lssl -lcrypto \
            -o /tmp/zsign
          cd -

          echo "=== zsign binary (expect Mach-O arm64 for iOS) ==="
          file /tmp/zsign
          lipo -info /tmp/zsign
          ls -lh /tmp/zsign
          echo "zsign built successfully"

      - name: Sign with entitlements + 打包资源
        run: |
          set -e
          LDID=$(command -v ldid)

          if [ -z "$LDID" ]; then
            echo "ldid not available, skipping CI signing (device-side zsign will sign at runtime)"
          else
            echo "Using ldid: $LDID"
          fi

          do_sign() {
            local bin="$1" plist="$2"
            if [ -n "$LDID" ]; then
              echo "Signing $bin with $plist"
              "$LDID" -S"$plist" "$bin"
            else
              echo "Skipping sign for $bin (no ldid)"
            fi
          }

          do_sign_bare() {
            local bin="$1"
            if [ -n "$LDID" ]; then
              echo "Bare-signing $bin"
              "$LDID" -S "$bin"
            else
              echo "Skipping bare sign for $bin (no ldid)"
            fi
          }

          # --- Rootless deb (Dopamine) ---
          PKG="Packages/rootless"
          RL="$PKG/var/jb"
          mkdir -p "$RL/Applications" "$RL/usr/libexec" "$RL/usr/local/bin" \
                   "$RL/usr/share/reprovision/certificates" \
                   "$RL/Library/LaunchDaemons"
          APP_DIR=$(find build -name "ReSign.app" -type d | head -1)
          cp -R "$APP_DIR" "$RL/Applications/"
          cp build/repro-helper "$RL/usr/libexec/"
          cp /tmp/zsign "$RL/usr/local/bin/zsign"
          chmod 0755 "$RL/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$RL/usr/share/reprovision/certificates/"

          # 验证 Assets.car 存在（图标依赖于此文件）
          echo "=== 验证 .app 包结构 ==="
          ls -lah "$RL/Applications/ReSign.app/"
          if [ -f "$RL/Applications/ReSign.app/Assets.car" ]; then
              echo "Assets.car 存在: $(ls -lh "$RL/Applications/ReSign.app/Assets.car" | awk '{print $5}')"
          else
              echo "警告: Assets.car 不存在！图标可能无法显示"
          fi

          # 复制图标（供 Sileo/Cydia 显示，不影响 iOS 图标加载）
          cp Resources/Icon.png "$RL/Applications/ReSign.app/Icon.png"

          # 签名：先签二进制，不破坏 Assets.car
          # 设置正确的权限：root 可执行
          chmod 0755 "$RL/Applications/ReSign.app/ReSign"
          do_sign "$RL/Applications/ReSign.app/ReSign" Resources/entitlements-base.plist
          do_sign "$RL/usr/libexec/repro-helper" Resources/entitlements-helper.plist
          cp build/repro-signingd "$RL/usr/libexec/"
          cp Resources/jp.soh.reprovision.signingd.plist "$RL/Library/LaunchDaemons/"
          chmod 0755 "$RL/usr/libexec/repro-signingd"
          # v1.1.64：signingd 必须带 backboardd.launchapplications / multitasking.*assertions
          # 才能唤醒 App 到后台并保活。此前 rootless/rootful 甚至完全没签 → 唤醒永远失败。
          do_sign "$RL/usr/libexec/repro-signingd" Resources/entitlements-signingd.plist
          do_sign_bare "$RL/usr/local/bin/zsign"
          # 4755 = setuid root。postinst 里还会再设一次（CI 非 root，dpkg-deb 存不住属主）
          chmod 4755 "$RL/usr/libexec/repro-helper"

          # --- Rootful deb ---
          PKG2="Packages/rootful"
          mkdir -p "$PKG2/Applications" "$PKG2/usr/libexec" "$PKG2/usr/local/bin" \
                   "$PKG2/usr/share/reprovision/certificates" \
                   "$PKG2/Library/LaunchDaemons"
          cp -R "$APP_DIR" "$PKG2/Applications/"
          cp build/repro-helper "$PKG2/usr/libexec/"
          cp /tmp/zsign "$PKG2/usr/local/bin/zsign"
          chmod 0755 "$PKG2/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$PKG2/usr/share/reprovision/certificates/"
          cp Resources/Icon.png "$PKG2/Applications/ReSign.app/Icon.png"
          do_sign "$PKG2/Applications/ReSign.app/ReSign" Resources/entitlements-base.plist
          do_sign "$PKG2/usr/libexec/repro-helper" Resources/entitlements-helper.plist
          cp build/repro-signingd "$PKG2/usr/libexec/"
          cp Resources/jp.soh.reprovision.signingd.plist "$PKG2/Library/LaunchDaemons/"
          chmod 0755 "$PKG2/usr/libexec/repro-signingd"
          do_sign "$PKG2/usr/libexec/repro-signingd" Resources/entitlements-signingd.plist
          do_sign_bare "$PKG2/usr/local/bin/zsign"
          chmod 4755 "$PKG2/usr/libexec/repro-helper"

          # --- RootHide deb ---
          PKG3="Packages/roothide"
          mkdir -p "$PKG3/Applications" "$PKG3/usr/libexec" "$PKG3/usr/local/bin" \
                   "$PKG3/usr/share/reprovision/certificates" \
                   "$PKG3/Library/LaunchDaemons"
          cp -R "$APP_DIR" "$PKG3/Applications/"
          cp build/repro-helper "$PKG3/usr/libexec/"
          cp build/repro-profiledaemon "$PKG3/usr/libexec/"
          cp build/repro-importdaemon "$PKG3/usr/libexec/"
          cp build/repro-signingd "$PKG3/usr/libexec/"
          cp /tmp/zsign "$PKG3/usr/local/bin/zsign"
          chmod 0755 "$PKG3/usr/local/bin/zsign"
          cp Resources/Certificates/*.pem "$PKG3/usr/share/reprovision/certificates/"
          cp Resources/Icon.png "$PKG3/Applications/ReSign.app/Icon.png"
          cp Resources/jp.soh.reprovision.profiledaemon.plist "$PKG3/Library/LaunchDaemons/"
          cp Resources/jp.soh.reprovision.importdaemon.plist "$PKG3/Library/LaunchDaemons/"
          # v1.1.65：roothide 用专属 LaunchDaemon plist（带 _MSSafeMode=1/_SafeMode=1，
          # 否则 RootHide 运行时剥离 backboardd.launchapplications → SBSLaunch 返回 7）
          cp Resources/jp.soh.reprovision.signingd-roothide.plist "$PKG3/Library/LaunchDaemons/jp.soh.reprovision.signingd.plist"
          do_sign "$PKG3/Applications/ReSign.app/ReSign" Resources/entitlements-roothide.plist
          do_sign "$PKG3/usr/libexec/repro-helper" Resources/entitlements-roothide-helper.plist
          do_sign "$PKG3/usr/libexec/repro-profiledaemon" Resources/entitlements-profiledaemon.plist
          do_sign "$PKG3/usr/libexec/repro-importdaemon" Resources/entitlements-importdaemon.plist
          chmod 0755 "$PKG3/usr/libexec/repro-signingd"
          do_sign "$PKG3/usr/libexec/repro-signingd" Resources/entitlements-signingd-roothide.plist
          do_sign_bare "$PKG3/usr/local/bin/zsign"
          chmod 4755 "$PKG3/usr/libexec/repro-helper"

          echo "Signing + packaging complete for all 3 packages (with zsign)"

      - name: Package debs
        run: |
          set -e
          # 版本号以 DEBIAN/control 中的 Version 为准（PackageVersion.plist 的 string 字段含空值，grep 易误取）
          VERSION=$(grep -m1 '^Version:' Packages/rootless/DEBIAN/control | awk '{print $2}')
          echo "Version: $VERSION"
          mkdir -p CydiaPackages

          # DEBIAN 维护脚本必须有可执行权限（0555~0775），否则 dpkg-deb 报错
          for pkg in rootless rootful roothide; do
            find "Packages/$pkg/DEBIAN" -type f -exec chmod 0755 {} \;
          done

          dpkg-deb -Zgzip -b Packages/rootless "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm64.deb"
          dpkg-deb -Zgzip -b Packages/rootful "CydiaPackages/jp.soh.reprovision_${VERSION}_iphoneos-arm.deb"
          dpkg-deb -Zgzip -b Packages/roothide "CydiaPackages/jp.soh.reprovision_${VERSION}_roothide-iphoneos-arm64.deb"

          ls -lh CydiaPackages/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ReSign ${{ github.ref_name }}"
          body: |
            ## ReSign ${{ github.ref_name }}
            ### 安装包
            | 包 | 适用环境 |
            |---|---|
            | `*_roothide-iphoneos-arm64.deb` | **RootHide 用户安装此包** |
            | `*_iphoneos-arm64.deb` | Dopamine / rootless |
            | `*_iphoneos-arm.deb` | rootful (iOS 13/14) |
          files: CydiaPackages/*.deb
          draft: false
          prerelease: false
